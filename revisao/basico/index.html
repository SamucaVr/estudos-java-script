<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão do básico</title>
</head>

<body>
    <label for="palpite">Digite um número:</label>
    <input type="number" id="palpite">
    <button id="botaoEnviar">Enviar</button>

    <p id="vida"></p>
    <p id="resultado"></p>

    <script>
        window.alert('Um número aleatório foi gerado.\nVocê tem 3 tentativas pra acertar o número.')

        const palpites = document.getElementById('palpite');
        const botaoEnviar = document.getElementById('botaoEnviar');
        const resultado = document.getElementById('resultado');
        const vida = document.getElementById('vida');
        let vidaFinal = 3;
        let statusVitoria = false;

        const geradorAleatorio = () => {
            let aleatorio = Math.random() * 101;

            return Math.floor(aleatorio);
        }

        let numeroAleatorio = geradorAleatorio();
        console.log(numeroAleatorio)

        // função principal responsável por atualizar tudo quando o botão for clicado
        botaoEnviar.onclick = () => {
            const palpite = Number(palpites.value);

            if (palpite < 0 || palpite > 100 || palpite == '') {
                window.alert('Por favor, informe um número entre 0 e 100!');
                limparCampo();
            } else {
                verificarPalpite(palpite);
                verificarVitoria();
                vida.textContent = `Você tem ${vidaFinal} vidas.`;
            }
            
        }

        const limparCampo = () => {
            palpites.value = '';
        }

        const verificarVitoria = () => {
            if (vidaFinal > 0 && statusVitoria) {
                window.alert('Parabéns, você acertou o número!');
                resultado.textContent = `Esse foi o número sorteado: ${numeroAleatorio}`;

                palpites.disabled = true;
                botaoEnviar.disabled = true;
            } else if (vidaFinal < 1) {
                window.alert('Que pena, você não acertou o número!');
                resultado.textContent = `Esse foi o número sorteado: ${numeroAleatorio}`;

                palpites.disabled = true;
                botaoEnviar.disabled = true;
            }
        }

        const verificarPalpite = (palpite) => {
                if (palpite > numeroAleatorio) {
                    resultado.textContent = `O número ${palpite} é maior do que o número gerado.`;
                    vidaFinal--;
                } else if (palpite < numeroAleatorio) {
                    resultado.textContent = `O número ${palpite} é menor do que o número gerado.`;
                    vidaFinal--;
                } else {
                    statusVitoria = true;
                }
                limparCampo();
        }
        vida.textContent = `Você tem ${vidaFinal} vidas.`;
    </script>
</body>

</html>
